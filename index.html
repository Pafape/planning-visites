<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--surf:#fff;--ink:#14213d;--mut:#5a6579;--line:#d9dfe8;--pri:#1f4fd8;--on-pri:#fff;--tab:#14213d;--on-tab:#fff;--danger:#b3261e;--ok:#17603a;--warn:#9a5600;
font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1526;--surf:#16213a;--ink:#e8edf7;--mut:#a3afc5;--line:#2a3857;--pri:#7aa2ff;--on-pri:#0b1630;--tab:#223356;--on-tab:#e8edf7;--danger:#ff9a90;--ok:#7fdca5;--warn:#ffc864}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-size:17px;line-height:1.4;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
header h1{font-size:19px;margin:0}
.who{background:transparent;border:1px solid currentColor;border-radius:99px;padding:6px 12px;font-size:14px;color:inherit}
main{padding:8px 0 110px;max-width:640px;margin:0 auto}
.search{display:block;width:calc(100% - 32px);margin:12px 16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surf)}
.dept{background:var(--tab);color:var(--on-tab);padding:8px 16px;margin-top:18px;font-weight:700;display:flex;justify-content:space-between}
.row{background:var(--surf);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.row b{display:block}.row small,.row a{color:var(--mut);font-size:15px;display:block;word-break:break-word}
.row a{color:var(--pri)}
.edit{flex:none;min-width:48px;min-height:48px;border:1px solid var(--line);background:transparent;border-radius:10px}
.badge{display:inline-block;font-size:13px;border:1px solid var(--pri);color:var(--pri);border-radius:99px;padding:1px 8px;margin-top:4px}
.badge.v{border-color:var(--line);color:var(--mut)}
.empty{padding:32px 16px;text-align:center;color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:14px 2px;font-size:14px;font-weight:700;color:var(--mut);border-top:3px solid transparent}
nav button[aria-current="true"]{color:var(--pri);border-top-color:var(--pri)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--pri);color:var(--on-pri);border:0;border-radius:99px;padding:14px 20px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surf);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 12px;font-size:20px}
label{display:block;margin:12px 0 4px;font-weight:700;font-size:15px}
.sheet input,.sheet select,.sheet textarea,.login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.btns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);background:transparent;font-weight:700}
.btn.p{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.btn.d{color:var(--danger);border-color:var(--danger)}
.login{max-width:420px;margin:0 auto;padding:48px 20px}
.login h1{font-size:28px;margin:0 0 6px}.login p{color:var(--mut);margin:0 0 20px}
.pick{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border:1px solid var(--line);background:var(--surf);border-radius:12px}
.pick small{display:block;color:var(--mut)}
.err{color:var(--danger);margin:8px 0;min-height:1.4em}
.sec{padding:16px}.sec h3{margin:0 0 4px;font-size:18px}.sec p{margin:0 0 10px;color:var(--mut);font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:30;font-size:15px}
.alert{margin:12px 16px;padding:12px 14px;border-left:5px solid var(--warn);background:var(--surf);border-radius:6px}
.alert.ok{border-left-color:var(--ok)}.alert ul{margin:6px 0 0;padding-left:18px}
.seg{display:flex;margin:12px 16px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:12px;border:0;background:var(--surf);font-weight:700;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--on-pri)}
.badge.w{border-color:var(--warn);color:var(--warn)}
.row .site{color:var(--pri);font-weight:700}
.cnt{display:block;font-size:14px;margin-top:4px;color:var(--ok)}.cnt.w{color:var(--warn)}
.sheet textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);resize:vertical}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px}
.filters label{margin:0;font-size:14px;color:var(--mut)}
.filters select{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--ink)}
.kpis{display:grid;grid-template-columns:1fr 1fr;margin:4px 16px 0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.kpis div{padding:12px;background:var(--surf);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpis b{display:block;font-size:28px;line-height:1.1}.kpis span{font-size:14px;color:var(--mut)}.kpis .w b{color:var(--warn)}
.acts{display:flex;flex-direction:column;gap:6px;flex:none}.acts .edit{padding:8px 10px;font-size:14px;min-height:44px}
.jl{border-left:3px solid var(--line);padding:2px 10px;margin:8px 0}.jl small{display:block;color:var(--mut);font-size:14px}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:6px 16px 10px}
.cw{text-align:center;color:var(--mut);font-size:14px}
.cd{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--surf);font-size:16px;padding:0}
.cd.today{border:2px solid var(--pri)}.cd.sel{background:var(--pri);color:var(--on-pri)}
.dot{position:absolute;right:3px;bottom:2px;font-size:11px;line-height:1.3;background:var(--tab);color:var(--on-tab);border-radius:99px;padding:0 5px}
.calh{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 0}.calh .edit{min-width:64px}
.lnk{border:1px solid var(--pri);color:var(--pri);background:transparent;border-radius:8px;padding:6px 10px;margin-left:6px;font-size:14px}
.filters input{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--ink)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== Données (couche de stockage isolée : à remplacer par Firebase à l'étape suivante) ===== */
const SKEY='planning-visites-session', CKEY='planning-visites-code';
const uid=()=>Math.random().toString(36).slice(2,10);
const SEED=()=>({codeAdmin:'admin',
 sites:[
  {id:'S1',nom:'FT Creutzwald',adresse:'6 rue de Carling 57150 CREUTZWALD',email:'eldcreutzwald@francetravail.fr',dept:'MOSELLE'},
  {id:'S2',nom:'FT Reims',adresse:'3 rue de Champagne 51100 REIMS',email:'eldreims@francetravail.fr',dept:'MARNE'},
  {id:'S3',nom:'FT Strasbourg',adresse:'4 rue des pommes 67000 STRASBOURG',email:'eldstrasbourg@francetravail.fr',dept:'BAS-RHIN'}],
 personnes:[
  {id:'P1',prenom:'Patrick',nom:'Plage',fonction:'Délégué syndical',role:'admin'},
  {id:'P2',prenom:'Jean-Michel',nom:'Welche',fonction:'Délégué syndical',role:'admin'},
  {id:'P3',prenom:'Stephan',nom:'Gutfreund',fonction:'Élu CSE',role:'visiteur'}],
 visites:[
  {id:'V1',site:'S1',date:'2026-10-06',v:['P1','P3'],cr:"Visite effectuée, échanges avec la Direction sur l'accueil du public.",createdBy:'P1'},
  {id:'V2',site:'S3',date:'2026-10-09',v:['P2'],cr:'',createdBy:'P2'},
  {id:'V3',site:'S1',date:'2026-10-21',v:['P2','P3'],cr:'',createdBy:'P1'},
  {id:'V4',site:'S3',date:'2026-10-28',v:['P1','P2'],cr:'',createdBy:'P1'},
  {id:'V5',site:'S2',date:'2026-11-04',v:['P3'],cr:'',createdBy:'P2'},
  {id:'V6',site:'S1',date:'2026-11-12',v:['P1'],cr:'',createdBy:'P1'},
  {id:'V7',site:'S3',date:'2026-11-19',v:['P3'],cr:'',createdBy:'P3'},
  {id:'V8',site:'S1',date:'2026-11-26',v:['P1','P2'],cr:'',createdBy:'P2'},
  {id:'V9',site:'S3',date:'2026-12-03',v:['P1'],cr:'',createdBy:'P1'},
  {id:'V10',site:'S1',date:'2026-12-10',v:['P2','P3'],cr:'',createdBy:'P2'}],
 categories:['Conditions de travail','Sécurité','Accueil du public','Locaux et matériel','Organisation du travail','Autre'],
 remontees:[
  {id:'R1',visite:'V1',texte:"Affichage syndical peu visible dans la salle de pause.",cat:'Locaux et matériel',statut:'encours',action:"Demande envoyée à la Direction, réponse attendue.",resp:'P1',createdBy:'P1'},
  {id:'R2',visite:'V1',texte:"Questions des agents sur le calendrier des congés d'été.",cat:'Organisation du travail',statut:'ouverte',action:'',resp:'',createdBy:'P3'},
  {id:'R3',visite:'V2',texte:"Files d'attente longues à l'accueil aux heures de pointe.",cat:'Accueil du public',statut:'traitee',action:"Renfort ponctuel mis en place par la Direction.",resp:'P2',createdBy:'P2'}]});
const migrate=d=>{(d.remontees||[]).forEach(x=>{if(!x.journal){const v=(d.visites||[]).find(y=>y.id===x.visite);x.journal=x.action?[{id:uid(),date:v?v.date:new Date().toISOString().slice(0,10),auteur:x.createdBy,texte:x.action}]:[];delete x.action}});return d};
const emptyData=()=>({codeAdmin:'',categories:[],sites:[],personnes:[],visites:[],remontees:[]});
let data=emptyData(), S={user:null,tab:'plan',scope:'all',pv:'list',cal:null,day:'',f:{per:'sem',dept:'',site:'',pers:'',stat:'',rs:'',cat:''},q:'',login:{step:'code'},ready:false,off:!navigator.onLine,waiting:null};
const isAdmin=()=>S.user&&S.user.role==='admin';
/* ===== Firebase : base partagée en temps réel (espace identifié par le code d'équipe) ===== */
const FB_CFG={apiKey:"AIzaSyCjGD5XWnfx8obzaCYw-eDODGoJ7rQsQx4",authDomain:"planning-visites.firebaseapp.com",projectId:"planning-visites",storageBucket:"planning-visites.firebasestorage.app",messagingSenderId:"273595718292",appId:"1:273595718292:web:42cfd359c3b01d05f47281"};
const COLS=['sites','personnes','visites','remontees'];
let FB=null,NS='',unsub=[],shadow={},loaded=new Set(),cfgExists=false;
const sj=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
async function nsOf(code){if(!(window.crypto&&crypto.subtle))throw new Error('crypto');const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pv|'+code.trim()));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,40)}
async function fbInit(){
 if(FB)return FB;
 const B='https://www.gstatic.com/firebasejs/10.12.2/';
 const [A,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js')]);
 const app=A.initializeApp(FB_CFG);let db;
 try{db=F.initializeFirestore(app,{ignoreUndefinedProperties:true,localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(err){db=F.getFirestore(app)}
 return FB={F,db};
}
function disconnect(){unsub.forEach(f=>{try{f()}catch(err){}});unsub=[];NS='';loaded=new Set();cfgExists=false;data=emptyData();S.ready=false}
function errMsg(er){const c=String((er&&(er.code||er.message))||'');
 if(/permission-denied/.test(c))return "Accès refusé par la base. Les règles Firestore ne sont pas publiées (ou pas à jour).";
 if(/timeout/.test(c))return "Pas de réponse de la base après 15 secondes. Vérifiez le réseau et que la base Firestore est bien créée.";
 if(/crypto/.test(c))return "Ce navigateur ne permet pas la connexion sécurisée. Ouvrez l'application depuis son adresse https.";
 if(/import|fetch|module|Load failed/i.test(c))return "Impossible de charger Firebase. Ouvrez l'application depuis son adresse GitHub Pages, avec une connexion internet.";
 return 'Connexion impossible ('+c+').'}
function onErr(err){console.error(err);if(S.waitRej){const w=S.waitRej;S.waitRej=null;S.waiting=null;w(err);return}toast(err&&err.code==='permission-denied'?'Accès refusé par la base de données':'Erreur de synchronisation')}
function applySnap(c,docs){const old=new Map(data[c].map(o=>[o.id,o]));data[c]=docs.map(d=>{const o=old.get(d.id);if(o){Object.keys(o).forEach(k=>delete o[k]);Object.assign(o,d);return o}return d})}
function onSync(){
 if(loaded.size<5)return;
 S.ready=true;
 if(S.waiting){const w=S.waiting;S.waiting=null;w();return}
 if(S.user&&!data.personnes.includes(S.user)){const x=data.personnes.find(y=>y.id===S.user.id);if(x)S.user=x;else{S.user=null;S.login={step:'name'}}}
 render();
}
async function connect(code){
 disconnect();
 const {F,db}=await fbInit();
 NS=await nsOf(code);
 shadow={sites:{},personnes:{},visites:{},remontees:{},cfg:''};
 COLS.forEach(c=>unsub.push(F.onSnapshot(F.collection(db,'espaces',NS,c),{includeMetadataChanges:true},snap=>{
  const sh={},docs=[];snap.forEach(d=>{const o={...d.data(),id:d.id};docs.push(o);sh[d.id]=sj(o)});
  const ch=sj(sh)!==sj(shadow[c]);
  if(ch){applySnap(c,docs);shadow[c]=sh}
  const was=loaded.has(c);
  if(!(snap.empty&&snap.metadata.fromCache&&navigator.onLine))loaded.add(c);
  if(ch||!was)onSync();
 },onErr)));
 unsub.push(F.onSnapshot(F.doc(db,'espaces',NS,'meta','config'),{includeMetadataChanges:true},snap=>{
  const ex=snap.exists();let ch=false;
  if(ex){const d=snap.data(),j=sj({codeAdmin:d.codeAdmin,categories:d.categories});if(j!==shadow.cfg){shadow.cfg=j;data.codeAdmin=d.codeAdmin;data.categories=d.categories||[];ch=true}}
  if(ex!==cfgExists){cfgExists=ex;ch=true}
  const was=loaded.has('cfg');
  if(!(!ex&&snap.metadata.fromCache&&navigator.onLine))loaded.add('cfg');
  if(ch||!was)onSync();
 },onErr));
}
function connectWait(code){return new Promise((res,rej)=>{const t=setTimeout(()=>{S.waiting=null;S.waitRej=null;rej(new Error('timeout'))},15000);S.waiting=()=>{clearTimeout(t);S.waitRej=null;res()};S.waitRej=x=>{clearTimeout(t);rej(x)};connect(code).catch(err=>{clearTimeout(t);S.waiting=null;S.waitRej=null;rej(err)})})}
function commit(){
 if(!FB||!NS)return;
 const {F,db}=FB;
 COLS.forEach(c=>{const col=F.collection(db,'espaces',NS,c),cur={};
  data[c].forEach(o=>{if(o.id)cur[o.id]=sj(o)});
  Object.keys(cur).forEach(id=>{if(shadow[c][id]!==cur[id]){shadow[c][id]=cur[id];F.setDoc(F.doc(col,id),JSON.parse(cur[id])).catch(onErr)}});
  Object.keys(shadow[c]).forEach(id=>{if(!(id in cur)){delete shadow[c][id];F.deleteDoc(F.doc(col,id)).catch(onErr)}});
 });
 const cfg=sj({codeAdmin:data.codeAdmin,categories:data.categories});
 if(shadow.cfg!==cfg){shadow.cfg=cfg;F.setDoc(F.doc(db,'espaces',NS,'meta','config'),JSON.parse(cfg)).catch(onErr)}
}
async function tryCode(create){
 const code=(($('#code')||{}).value||'').trim();
 if(!code)return;
 if(create&&code.length<8){S.login={step:'create',err:'Au moins 8 caractères.'};return render()}
 S.login={step:'wait'};render();
 try{await connectWait(code)}catch(err){disconnect();S.login={step:create?'create':'code',err:errMsg(err)};return render()}
 if(create){
  if(cfgExists){disconnect();S.login={step:'create',err:'Cet espace existe déjà : utilisez Continuer avec ce code.'};return render()}
  data=migrate(SEED());commit();
 }else if(!cfgExists){disconnect();S.login={step:'code',err:'Code incorrect.'};return render()}
 try{localStorage.setItem(CKEY,code)}catch(err){}
 S.login={step:'name'};render();
}
async function changeTeam(nc){
 if(nc.length<8)return toast('Au moins 8 caractères');
 if(!navigator.onLine)return toast('Connexion internet nécessaire');
 if(!confirm("Tous les visiteurs devront saisir le nouveau code. Continuer ?"))return;
 const {F,db}=FB,old=NS,nn=await nsOf(nc),me=S.user.id,ref=(n,c,i)=>F.doc(db,'espaces',n,c,i);
 try{
  await Promise.all([...COLS.flatMap(c=>data[c].map(o=>F.setDoc(ref(nn,c,o.id),JSON.parse(sj(o))))),F.setDoc(ref(nn,'meta','config'),{codeAdmin:data.codeAdmin,categories:data.categories})]);
  await Promise.all([...COLS.flatMap(c=>data[c].map(o=>F.deleteDoc(ref(old,c,o.id)))),F.deleteDoc(ref(old,'meta','config'))]);
  try{localStorage.setItem(CKEY,nc)}catch(err){}
  await connectWait(nc);S.user=data.personnes.find(x=>x.id===me)||null;if(!S.user)S.login={step:'name'};render();toast("Code d'équipe modifié");
 }catch(err){onErr(err)}
}

const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function toast(t){const n=document.createElement('div');n.className='toast';n.textContent=t;document.body.appendChild(n);setTimeout(()=>n.remove(),2200)}

/* ===== Écrans ===== */
function render(){$('#app').innerHTML=S.user?shell():login()}
function login(){
 const l=S.login;
 if(l.step==='wait')return `<div class="login"><h1>Planning de visites</h1><p>Connexion en cours...</p></div>`;
 if(l.step==='code')return `<div class="login"><h1>Planning de visites</h1><p>Saisissez le code d'équipe.</p>
 <input id="code" type="password" autocomplete="off" aria-label="Code d'équipe"><div class="err" id="err">${e(l.err||'')}</div>
 <div class="btns"><button class="btn p" data-act="code">Continuer</button></div>
 <div class="btns"><button class="btn" data-act="tocreate">Première utilisation : créer l'espace</button></div></div>`;
 if(l.step==='create')return `<div class="login"><h1>Créer l'espace d'équipe</h1><p>Choisissez un code d'équipe d'au moins 8 caractères, difficile à deviner (une courte phrase convient). Il protège l'accès aux données et sera à transmettre aux visiteurs.</p>
 <input id="code" type="password" autocomplete="off" aria-label="Nouveau code d'équipe"><div class="err" id="err">${e(l.err||'')}</div>
 <div class="btns"><button class="btn" data-act="back0">Retour</button><button class="btn p" data-act="docreate">Créer</button></div></div>`;
 if(l.step==='name')return `<div class="login"><h1>Qui êtes-vous ?</h1><p>Choisissez votre nom.</p>
 ${data.personnes.map(p=>`<button class="pick" data-act="pick" data-id="${p.id}">${e(p.prenom)} ${e(p.nom)}<small>${e(p.fonction)}</small></button>`).join('')||'<div class="empty">Aucune personne enregistrée.</div>'}</div>`;
 return `<div class="login"><h1>Code administrateur</h1><p>${e(l.pick.prenom)}, saisissez le code administrateur.</p>
 <input id="code" type="password" autocomplete="off" aria-label="Code administrateur"><div class="err" id="err"></div>
 <div class="btns"><button class="btn" data-act="back">Retour</button><button class="btn p" data-act="admincode">Valider</button></div></div>`;
}
function shell(){
 const tabs=[['plan','Planning'],['dash','Tableau'],['sites','Sites'],['pers','Personnes']];if(isAdmin())tabs.push(['reg','Réglages']);
 return `<header><h1>${S.tab==='plan'?'Planning':S.tab==='dash'?'Tableau de bord':S.tab==='sites'?'Sites':S.tab==='pers'?'Personnes':'Réglages'}</h1>
 <button class="who" data-act="logout" aria-label="Changer d'utilisateur">${e(S.user.prenom)} · Quitter</button></header>

 <div class="sec"><h3>Catégories des remontées</h3><p>Séparées par des virgules. Choisir une catégorie reste facultatif.</p>
 <input id="cats" value="${e(data.categories.join(', '))}" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surf)" aria-label="Catégories">
 <div class="btns"><button class="btn p" data-act="savecats">Enregistrer les catégories</button></div></div>
 <div class="sec"><h3>Données de test</h3><p>Avant la mise en service, videz les sites de test, puis importez le fichier définitif.</p>
 <div class="btns"><button class="btn" data-act="reseed">Remettre les données de test</button><button class="btn d" data-act="clearsites">Vider les sites</button></div></div>`;
}

/* ===== Formulaires ===== */
function sheet(title,fields,vals,onSave,onDelete,after){
 const bg=document.createElement('div');bg.className='sheet-bg';
 bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${e(title)}"><h2>${e(title)}</h2>
 ${fields.map(f=>`<label for="f_${f.k}">${f.l}</label>`+(f.opts?`<select id="f_${f.k}">${f.opts.map(o=>`<option value="${o[0]}" ${vals[f.k]===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`:f.ta?`<textarea id="f_${f.k}" rows="5">${e(vals[f.k]||'')}</textarea>`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${e(vals[f.k]||'')}" autocomplete="off">`)).join('')}
 <div class="err" id="ferr"></div>
 <div class="btns"><button class="btn" data-x="c">Annuler</button><button class="btn p" data-x="s">Enregistrer</button></div>
 ${onDelete?'<div class="btns"><button class="btn d" data-x="d">Supprimer</button></div>':''}</div>`;
 document.body.appendChild(bg);
 const close=()=>bg.remove();
 bg.addEventListener('click',ev=>{const x=ev.target.dataset.x;if(ev.target===bg||x==='c'){close();after&&after()}
  if(x==='s'){const v={};fields.forEach(f=>v[f.k]=bg.querySelector('#f_'+f.k).value.trim());const m=onSave(v);if(m){bg.querySelector('#ferr').textContent=m;return}close();render();after&&after()}
  if(x==='d'&&confirm('Supprimer définitivement ?')){const m=onDelete();if(m){bg.querySelector('#ferr').textContent=m;return}close();render();after&&after()}});
 const f=bg.querySelector('input,select');f&&f.focus();
}
const ST={ouverte:'Ouverte',encours:'En cours',traitee:'Traitée'};
const remsOf=vid=>data.remontees.filter(x=>x.visite===vid);
function remsSheet(vid){
 const v=data.visites.find(x=>x.id===vid);if(!v)return;
 const L=remsOf(vid),bg=document.createElement('div');bg.className='sheet-bg';
 bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Remontées"><h2>Remontées</h2><p style="margin:0 0 8px;color:var(--mut)">${fdate(v.date)}, ${e(sname(v.site))}</p>`+
  (L.map(x=>`<button class="pick" data-x="r" data-id="${x.id}">${e(x.texte)}<small>${ST[x.statut]}${x.cat?', '+e(x.cat):''}</small></button>`).join('')||'<div class="empty">Aucune remontée pour cette visite.</div>')+
  `<div class="btns"><button class="btn" data-x="c">Fermer</button><button class="btn p" data-x="a">Ajouter une remontée</button></div></div>`;
 document.body.appendChild(bg);
 bg.addEventListener('click',ev=>{const t=ev.target.closest('[data-x]'),x=t&&t.dataset.x;
  if(ev.target===bg||x==='c'){bg.remove();render()}
  else if(x==='a'){bg.remove();remForm(null,vid,()=>remsSheet(vid))}
  else if(x==='r'){bg.remove();suivi(data.remontees.find(y=>y.id===t.dataset.id),vid,false)}});
}
function suivi(x,vid,direct){
 const v=data.visites.find(y=>y.id===vid);if(!v)return;
 const J=x.journal||[],bg=document.createElement('div');bg.className='sheet-bg';
 bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Suivi de la remontée"><h2>Suivi de la remontée</h2>
 <p style="margin:0 0 10px"><b>${e(x.texte)}</b><br><span style="color:var(--mut);font-size:15px">${fdate(v.date)}, ${e(sname(v.site))}${x.cat?', '+e(x.cat):''}${x.resp?', suivi par '+e(pname(x.resp)):''}</span></p>
 ${J.length?J.map(j=>`<div class="jl"><small>${fdmy(j.date)}, ${e(pname(j.auteur))}</small>${e(j.texte)}</div>`).join(''):'<div class="empty">Aucune action renseignée.</div>'}
 <label for="jt">Ce qui a été fait</label><textarea id="jt" rows="3"></textarea>
 <label for="js">Statut</label><select id="js">${Object.entries(ST).map(([k,l])=>`<option value="${k}" ${x.statut===k?'selected':''}>${l}</option>`).join('')}</select>
 <div class="err" id="ferr"></div>
 <div class="btns"><button class="btn" data-x="c">Fermer</button><button class="btn p" data-x="s">Enregistrer</button></div>
 <div class="btns"><button class="btn" data-x="m">Modifier la remontée</button></div></div>`;
 document.body.appendChild(bg);
 const back=()=>{bg.remove();render();if(!direct)remsSheet(vid)};
 bg.addEventListener('click',ev=>{const t=ev.target.closest('[data-x]'),k=t&&t.dataset.x;
  if(ev.target===bg||k==='c')back();
  else if(k==='m'){bg.remove();remForm(x,vid,()=>data.remontees.includes(x)?suivi(x,vid,direct):(direct?render():remsSheet(vid)))}
  else if(k==='s'){const txt=bg.querySelector('#jt').value.trim(),st=bg.querySelector('#js').value,ch=st!==x.statut;
   if(!txt&&!ch){bg.querySelector('#ferr').textContent='Décrivez ce qui a été fait ou changez le statut.';return}
   x.journal=[...J,{id:uid(),date:TODAY(),auteur:S.user.id,texte:txt+(ch?(txt?' ':'')+'(statut : '+ST[st].toLowerCase()+')':'')}];
   x.statut=st;commit();bg.remove();render();suivi(x,vid,direct);toast('Enregistré')}});
}
function remForm(r,vid,after){
 const cats=[['','Sans catégorie'],...data.categories.map(c=>[c,e(c)])];
 if(r&&r.cat&&!data.categories.includes(r.cat))cats.push([r.cat,e(r.cat)]);
 const pOpts=[['','Non attribué'],...data.personnes.map(x=>[x.id,e(x.prenom+' '+x.nom)])];
 sheet(r?'Modifier la remontée':'Nouvelle remontée',[
  {k:'texte',l:'Question ou problème remonté',ta:1},
  {k:'cat',l:'Catégorie (facultatif)',opts:cats},
  {k:'statut',l:'Statut',opts:[['ouverte','Ouverte'],['encours','En cours'],['traitee','Traitée']]},
  {k:'resp',l:'Responsable du suivi',opts:pOpts}],
  r||{statut:'ouverte'},
  x=>{if(!x.texte)return 'Décrivez la question ou le problème.';
   if(r)Object.assign(r,x);else data.remontees.push({id:uid(),visite:vid,createdBy:S.user.id,journal:[],...x});commit()},
  r&&(()=>{data.remontees=data.remontees.filter(y=>y.id!==r.id);commit()}),
  after);
}
function visitForm(v,preset){
 const sOpts=[['','Choisir un site'],...[...data.sites].sort((a,b)=>a.nom.localeCompare(b.nom)).map(x=>[x.id,e(x.nom)])];
 const pOpts=data.personnes.map(x=>[x.id,e(x.prenom+' '+x.nom)]);
 const vals=v?{site:v.site,date:v.date,v1:v.v[0]||'',v2:v.v[1]||'',statut:v.statut||'prevue',cr:v.cr||''}:{site:(preset&&preset.site)||'',date:'',v1:S.user.id,v2:'',statut:'prevue',d2:'',d3:'',d4:'',cr:''};
 const fields=[{k:'site',l:'Site',opts:sOpts},{k:'date',l:'Date',t:'date'},
  {k:'v1',l:'Visiteur',opts:pOpts},{k:'v2',l:'Second visiteur (facultatif)',opts:[['','Aucun, visite seul'],...pOpts]},
  {k:'statut',l:'Statut de la visite',opts:[['prevue','Prévue'],['realisee','Réalisée'],['annulee','Annulée'],['reportee','Reportée']]}];
 if(!v)fields.push({k:'d2',l:'Date de la 2e visite (facultatif)',t:'date'},{k:'d3',l:'Date de la 3e visite (facultatif)',t:'date'},{k:'d4',l:'Date de la 4e visite (facultatif)',t:'date'});
 fields.push({k:'cr',l:'Compte rendu',ta:1});
 sheet(v?'Modifier la visite':'Planifier une visite',fields,vals,
  x=>{if(!x.site)return 'Choisissez un site.';if(!x.date)return 'Indiquez la date.';if(x.v2&&x.v1===x.v2)return 'Les deux visiteurs doivent être différents.';
   const rec={site:x.site,date:x.date,v:[x.v1,x.v2].filter(Boolean),statut:x.statut||'prevue',cr:x.cr,maj:{par:S.user.id,at:new Date().toISOString()}};
   if(rec.statut==='prevue'&&rec.cr&&rec.date<=TODAY())rec.statut='realisee';
   if(v)Object.assign(v,rec);
   else{data.visites.push({id:uid(),createdBy:S.user.id,...rec});
    const extra=[x.d2,x.d3,x.d4].filter(Boolean);extra.forEach(d=>data.visites.push({id:uid(),createdBy:S.user.id,...rec,maj:{...rec.maj},date:d,statut:'prevue',cr:''}));if(extra.length)toast((extra.length+1)+' visites créées')}
   commit()},
  v&&(()=>{data.visites=data.visites.filter(y=>y.id!==v.id);data.remontees=data.remontees.filter(y=>y.visite!==v.id);commit()}));
}
function siteForm(s){
 sheet(s?'Modifier le site':'Nouveau site',[{k:'nom',l:'Nom du site'},{k:'adresse',l:'Adresse'},{k:'email',l:'E-mail de la Direction',t:'email'},{k:'dept',l:'Département'}],s||{},
 v=>{if(!v.nom)return 'Le nom du site est obligatoire.';v.dept=v.dept.toUpperCase();if(s)Object.assign(s,v);else data.sites.push({id:uid(),...v});commit()},
 s&&(()=>{data.sites=data.sites.filter(x=>x.id!==s.id);const gone=data.visites.filter(x=>x.site===s.id).map(x=>x.id);data.remontees=data.remontees.filter(y=>!gone.includes(y.visite));data.visites=data.visites.filter(x=>x.site!==s.id);commit()}));
}
function persForm(p){
 sheet(p?'Modifier la personne':'Nouvelle personne',[{k:'prenom',l:'Prénom'},{k:'nom',l:'Nom'},{k:'fonction',l:'Fonction'},{k:'role',l:'Rôle',opts:[['visiteur','Visiteur'],['admin','Administrateur']]}],p||{role:'visiteur'},
 v=>{if(!v.prenom||!v.nom)return 'Le prénom et le nom sont obligatoires.';
  if(p&&p.role==='admin'&&v.role!=='admin'&&data.personnes.filter(x=>x.role==='admin').length<2)return 'Il faut garder au moins un administrateur.';
  if(p){Object.assign(p,v);if(S.user.id===p.id)S.user=p}else data.personnes.push({id:uid(),...v});commit()},
 p&&(()=>{if(p.id===S.user.id)return 'Vous ne pouvez pas supprimer votre propre fiche.';
  if(p.role==='admin'&&data.personnes.filter(x=>x.role==='admin').length<2)return 'Il faut garder au moins un administrateur.';
  data.personnes=data.personnes.filter(x=>x.id!==p.id);data.visites.forEach(v=>v.v=v.v.filter(i=>i!==p.id));data.remontees.forEach(y=>{if(y.resp===p.id)y.resp=''});commit()}));
}

/* ===== Import CSV ===== */
function parseCSV(t){
 const first=t.split(/\r?\n/)[0],sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';
 const rows=[];let r=[],c='',q=false;t=t.replace(/^\uFEFF/,'');
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'&&t[i+1]==='"'){c+='"';i++}else if(ch==='"')q=false;else c+=ch}
  else if(ch==='"')q=true;else if(ch===sep){r.push(c);c=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}
 if(c||r.length){r.push(c);rows.push(r)}return rows.filter(x=>x.some(y=>y.trim()));
}
function importSites(txt){
 const rows=parseCSV(txt);if(rows.length<2)return toast('Fichier vide ou illisible');
 const h=rows[0].map(norm),ix=n=>h.findIndex(x=>n.some(k=>x.startsWith(k)));
 const c={id:ix(['id']),nom:ix(['nom','site']),adr:ix(['adr']),mail:ix(['mail','e-mail','email']),dept:ix(['dep'])};
 if(c.nom<0)return toast('Colonne « nom » introuvable');
 let add=0,upd=0;
 rows.slice(1).forEach(r=>{const g=i=>i<0?'':(r[i]||'').trim();
  const rec={nom:g(c.nom),adresse:g(c.adr),email:g(c.mail),dept:g(c.dept).toUpperCase()};if(!rec.nom)return;
  const id=g(c.id).replace(/[\/\s]/g,'_'),ex=data.sites.find(s=>(id&&s.id===id)||(!id&&norm(s.nom)===norm(rec.nom)));
  if(ex){Object.assign(ex,rec);upd++}else{data.sites.push({id:id||uid(),...rec});add++}});
 commit();toast(`${add} ajouté(s), ${upd} mis à jour`);render();
}

/* ===== Événements ===== */
document.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
 if(a==='code'||a==='docreate')tryCode(a==='docreate')
 else if(a==='tocreate'){S.login={step:'create'};render()}
 else if(a==='back0'){S.login={step:'code'};render()}
 else if(a==='pick'){const p=data.personnes.find(x=>x.id===id);if(p.role==='admin'){S.login={step:'admin',pick:p};render()}else enter(p)}
 else if(a==='admincode'){if($('#code').value===data.codeAdmin)enter(S.login.pick);else $('#err').textContent='Code incorrect.'}
 else if(a==='back'){S.login={step:'name'};render()}
 else if(a==='logout'){S.user=null;S.login={step:'code'};disconnect();try{localStorage.removeItem(SKEY);localStorage.removeItem(CKEY)}catch(e){}render()}
 else if(a==='tab'){S.tab=b.dataset.t;render()}
 else if(a==='scope'){S.scope=id;render()}
 else if(a==='rems')remsSheet(id);
 else if(a==='pv'){S.pv=id;render()}
 else if(a==='day'){S.day=S.day===id?'':id;render()}
 else if(a==='cnav'){const c=S.cal||{y:new Date().getFullYear(),m:new Date().getMonth()};let m=c.m+Number(id),y=c.y;if(m<0){m=11;y--}if(m>11){m=0;y++}S.cal={y,m};S.day='';render()}
 else if(a==='planfor')visitForm(null,{site:id});
 else if(a==='maildir'){const v=data.visites.find(x=>x.id===id);if(v)mailDir(v)}
 else if(a==='editrem'){const x=data.remontees.find(y=>y.id===id);if(x)suivi(x,x.visite,true)}
 else if(a==='export')exportXlsx();
 else if(a==='savecats'){const c=$('#cats').value.split(',').map(x=>x.replace(/["<>]/g,'').trim()).filter(Boolean);if(!c.length)return toast('Indiquez au moins une catégorie');data.categories=c;commit();toast('Catégories enregistrées')}
 else if(a==='resetf'){S.f={per:'sem',dept:'',site:'',pers:'',stat:'',rs:'',cat:''};render()}
 else if(a==='addvisit')visitForm();else if(a==='editvisit')visitForm(data.visites.find(v=>v.id===id));
 else if(a==='addsite')siteForm();else if(a==='editsite')siteForm(data.sites.find(s=>s.id===id));
 else if(a==='addpers')persForm();else if(a==='editpers')persForm(data.personnes.find(p=>p.id===id));
 else if(a==='savecodes'){const y=$('#ca').value.trim();if(!y)return toast('Le code ne peut pas être vide');data.codeAdmin=y;commit();toast('Code administrateur enregistré')}
 else if(a==='changeteam')changeTeam($('#ne').value.trim());
 else if(a==='reseed'){if(confirm('Remplacer toutes les données par les données de test ?')){data=migrate(SEED());commit();S.user=null;S.login={step:'name'};render()}}
 else if(a==='clearsites'){if(confirm('Supprimer tous les sites ?')){data.sites=[];data.visites=[];data.remontees=[];commit();toast('Sites et visites supprimés')}}
});
document.addEventListener('input',ev=>{if(ev.target.id==='q'){S.q=ev.target.value;const p=ev.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('change',ev=>{if(ev.target.dataset.f){const k=ev.target.dataset.f;S.f[k]=ev.target.value;if(k==='per'&&ev.target.value==='mp'&&!S.f.mois){const d=new Date();S.f.mois=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}if(k==='dept'){const x=data.sites.find(y=>y.id===S.f.site);if(x&&S.f.dept&&x.dept!==S.f.dept)S.f.site=''}render();return}if(ev.target.id==='csv'&&ev.target.files[0]){const fl=ev.target.files[0];
  if(/\.xlsx?$/i.test(fl.name)){loadXLSX().then(()=>{const r=new FileReader();r.onload=()=>{try{const wb=XLSX.read(r.result,{type:'array'});importSites(XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]],{FS:';'}))}catch(err){toast('Fichier Excel illisible')}};r.readAsArrayBuffer(fl)}).catch(()=>toast('Connexion nécessaire pour lire un fichier Excel'))}
  else{const r=new FileReader();r.onload=()=>importSites(r.result);r.readAsText(fl,'utf-8')}}});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='code'){const b=document.querySelector('[data-act="code"],[data-act="docreate"],[data-act="admincode"]');b&&b.click()}});
function enter(p){S.user=p;S.tab='plan';try{localStorage.setItem(SKEY,p.id)}catch(e){}render()}
addEventListener('online',()=>{S.off=false;render()});addEventListener('offline',()=>{S.off=true;render()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
let savedCode=null;try{savedCode=localStorage.getItem(CKEY)}catch(err){}
if(savedCode){
 S.login={step:'wait'};render();
 connectWait(savedCode).then(()=>{
  if(!cfgExists){const off=!navigator.onLine;disconnect();if(!off){try{localStorage.removeItem(CKEY)}catch(err){}}S.login={step:'code',err:off?"Hors connexion : données non disponibles sur ce téléphone.":"Le code enregistré n'est plus valide."}}
  else{let id=null;try{id=localStorage.getItem(SKEY)}catch(err){}const x=data.personnes.find(y=>y.id===id);if(x)S.user=x;else S.login={step:'name'}}
  render();
 }).catch(er=>{disconnect();S.login={step:'code',err:errMsg(er)};render()});
}else render();
</script>
